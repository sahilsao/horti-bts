<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <base href="/">
    <!--<base href="/ufp/horti/bts/">-->
    <!--<base href="/btsnew/">-->    
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="images/icons/Coat_of_arms_of_Chhattisgarh.svg" />
    <link href="HortiBts.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="images/icons/Coat_of_arms_of_Chhattisgarh.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="images/icons/Coat_of_arms_of_Chhattisgarh.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/filedownload.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        //scrollAndFocus function to scroll to the element and focus on it
        window.scrollAndFocus = (element) => {
            element.scrollIntoView({ behavior: "smooth", block: "center" });
        };
    </script>
</body>

</html>
